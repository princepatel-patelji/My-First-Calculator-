<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic 3D Pro Calculator</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           NEUMORPHIC 3D REALISTIC DESIGN
           ========================================= */
        :root {
            --bg-color: #1e1e24;
            --text-main: #f0f0f0;
            --text-muted: #8a8a8a;
            --accent-orange: #ff9800;
            --accent-red: #ff4757;
            --accent-cyan: #00d2d3;
            
            --shadow-light: rgba(255, 255, 255, 0.05);
            --shadow-dark: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .calculator {
            background: var(--bg-color);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 
                -8px -8px 15px var(--shadow-light),
                10px 10px 20px var(--shadow-dark),
                inset -2px -2px 5px rgba(0,0,0,0.2),
                inset 2px 2px 5px rgba(255,255,255,0.02);
            width: 100%;
            max-width: 350px;
            border: 1px solid rgba(255,255,255,0.02);
            position: relative;
        }

        /* Top Header Area for Menu */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .brand {
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .menu-btn {
            background: var(--bg-color);
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            box-shadow: -3px -3px 7px var(--shadow-light), 3px 3px 7px var(--shadow-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
        }

        .menu-btn:active {
            box-shadow: inset -2px -2px 5px var(--shadow-light), inset 2px 2px 5px var(--shadow-dark);
            color: var(--accent-cyan);
        }

        /* Dropdown Menu */
        .dropdown {
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: -5px -5px 10px var(--shadow-light), 10px 10px 20px var(--shadow-dark);
            padding: 10px;
            width: 180px;
            display: none;
            z-index: 100;
            flex-direction: column;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .dropdown.active {
            display: flex;
        }

        .dropdown-item {
            color: var(--text-main);
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .dropdown-item:active {
            background: rgba(0, 0, 0, 0.2);
            color: var(--accent-orange);
            box-shadow: inset 2px 2px 5px var(--shadow-dark);
        }

        .dropdown-divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 5px 0;
        }

        /* Display Modifications */
        .display {
            background: #151519;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: right;
            box-shadow: 
                inset 5px 5px 10px rgba(0,0,0,0.8),
                inset -5px -5px 10px rgba(255,255,255,0.03);
            border: 1px solid rgba(0,0,0,0.5);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .previous-operand {
            color: var(--text-muted);
            font-size: 1.1rem;
            min-height: 24px;
            font-family: 'Orbitron', sans-serif;
            overflow-x: auto;
            scrollbar-width: none;
            white-space: nowrap;
        }

        /* Input field to replace Div for blinking cursor */
        .current-operand {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-align: right;
            width: 100%;
            cursor: text;
        }
        .current-operand::-webkit-scrollbar { display: none; }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        button.calc-key {
            cursor: pointer;
            border: none;
            outline: none;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            font-size: 1.4rem;
            font-weight: 500;
            border-radius: 50%;
            height: 60px;
            width: 60px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                -5px -5px 10px var(--shadow-light),
                5px 5px 10px var(--shadow-dark);
            transition: all 0.1s ease;
            touch-action: manipulation;
        }

        button.calc-key:active {
            box-shadow: 
                inset -3px -3px 7px var(--shadow-light),
                inset 3px 3px 7px var(--shadow-dark);
            color: var(--accent-cyan);
            transform: scale(0.95);
        }

        .btn-top { color: var(--accent-cyan); font-size: 1.2rem; font-weight: 700; }
        .btn-operator { color: var(--accent-orange); font-size: 1.8rem; font-weight: 500; }
        .btn-clear { color: var(--accent-red); }

        .btn-equals {
            background: var(--accent-orange);
            color: #fff;
            box-shadow: 
                -5px -5px 10px var(--shadow-light),
                5px 5px 10px rgba(255, 152, 0, 0.4);
        }

        .btn-equals:active {
            background: #e68a00;
            box-shadow: 
                inset -3px -3px 7px rgba(255,255,255,0.2),
                inset 3px 3px 7px rgba(0,0,0,0.3);
            color: #fff;
        }

        /* History Modal Overlay */
        .history-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 30, 36, 0.95);
            border-radius: 30px;
            display: none;
            flex-direction: column;
            padding: 20px;
            z-index: 200;
        }
        
        .history-modal.active { display: flex; }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-orange);
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            color: var(--text-main);
            font-size: 1rem;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-entry {
            background: #151519;
            padding: 10px;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        @media (max-width: 400px) {
            .calculator { width: 95%; padding: 25px 20px; }
            button.calc-key { width: 55px; height: 55px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="top-header">
            <div class="brand">PRINCE-PRO EDITION</div>
            <!-- Three Dot Menu Button -->
            <button class="menu-btn" id="menuBtn">⋮</button>
            
            <!-- Dropdown Menu for history and utility conversions -->
            <div class="dropdown" id="dropdownMenu">
                <div class="dropdown-item" onclick="toggleHistory()">📜 View History</div>
                <div class="dropdown-divider"></div>
                <div class="dropdown-item" onclick="convertUnit('kg_to_g')">⚖️ Kg to Grams</div>
                <div class="dropdown-item" onclick="convertUnit('g_to_kg')">⚖️ Grams to Kg</div>
                <div class="dropdown-item" onclick="convertUnit('c_to_f')">🌡️ °C to °F</div>
                <div class="dropdown-item" onclick="convertUnit('f_to_c')">🌡️ °F to °C</div>
            </div>
        </div>
        
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <!-- Input element introduces native blinking caret tracking capability -->
            <input type="text" class="current-operand" id="current-operand" value="0">
        </div>

        <div class="keypad">
            <button class="calc-key btn-top btn-clear" onclick="clearDisplay()">AC</button>
            <button class="calc-key btn-top" onclick="insertText('(')">(</button>
            <button class="calc-key btn-top" onclick="insertText(')')">)</button>
            <button class="calc-key btn-operator" onclick="insertText('/')">÷</button>

            <button class="calc-key" onclick="insertText('7')">7</button>
            <button class="calc-key" onclick="insertText('8')">8</button>
            <button class="calc-key" onclick="insertText('9')">9</button>
            <button class="calc-key btn-operator" onclick="insertText('*')">×</button>

            <button class="calc-key" onclick="insertText('4')">4</button>
            <button class="calc-key" onclick="insertText('5')">5</button>
            <button class="calc-key" onclick="insertText('6')">6</button>
            <button class="calc-key btn-operator" onclick="insertText('-')">−</button>

            <button class="calc-key" onclick="insertText('1')">1</button>
            <button class="calc-key" onclick="insertText('2')">2</button>
            <button class="calc-key" onclick="insertText('3')">3</button>
            <button class="calc-key btn-operator" onclick="insertText('+')">+</button>

            <!-- Delete key mapped to caret index manipulation -->
            <button class="calc-key btn-top" style="color: var(--accent-red); font-size: 1.3rem;" onclick="deleteChar()">⌫</button>
            <button class="calc-key" onclick="insertText('0')">0</button>
            <button class="calc-key" onclick="insertText('.')">.</button>
            <button class="calc-key btn-equals btn-operator" onclick="evaluateMath()">=</button>
        </div>

        <!-- Local Storage History Rendering Interface -->
        <div class="history-modal" id="historyModal">
            <div class="history-header">
                <span>Calculation History</span>
                <div class="menu-btn" onclick="toggleHistory()" style="box-shadow:none;">✖</div>
            </div>
            <div class="history-list" id="historyList"></div>
            <div class="dropdown-item" style="text-align:center; color: var(--accent-red); background:rgba(255,0,0,0.1);" onclick="clearHistory()">Clear History</div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('current-operand');
        const prevField = document.getElementById('previous-operand');
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const historyModal = document.getElementById('historyModal');
        const historyList = document.getElementById('historyList');

        let isResultState = false;

        /* =========================================
           THREE-DOT MENU LOGIC
           ========================================= */
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!dropdownMenu.contains(e.target) && e.target !== menuBtn) {
                dropdownMenu.classList.remove('active');
            }
        });

        /* =========================================
           CURSOR AND CARET POSITIONING LOGIC
           ========================================= */
        function focusInput() {
            inputField.focus();
        }

        // Prevents virtual keyboard from occluding the Neumorphic interface on mobile devices
        inputField.addEventListener('focus', function() {
            inputField.setAttribute('readonly', 'readonly');
            setTimeout(() => {
                inputField.removeAttribute('readonly');
            }, 100);
        });

        function insertText(char) {
            focusInput();
            if (isResultState && !isNaN(char)) {
                inputField.value = '';
                isResultState = false;
            } else {
                isResultState = false;
            }

            if (inputField.value === '0' && char !== '.') {
                inputField.value = '';
            }

            const startPos = inputField.selectionStart;
            const endPos = inputField.selectionEnd;
            const currentVal = inputField.value;

            // Algorithmically slices string to inject character exactly at the blinking caret index
            inputField.value = currentVal.substring(0, startPos) + char + currentVal.substring(endPos);
            
            // Programmatically advances caret beyond the injected character
            const newPos = startPos + char.length;
            inputField.setSelectionRange(newPos, newPos);
        }

        function deleteChar() {
            focusInput();
            if (inputField.value === 'Error') {
                clearDisplay();
                return;
            }
            
            const startPos = inputField.selectionStart;
            const currentVal = inputField.value;

            // Determines backward deletion bounding parameters based on selection ranges
            if (startPos > 0) {
                inputField.value = currentVal.substring(0, startPos - 1) + currentVal.substring(startPos);
                inputField.setSelectionRange(startPos - 1, startPos - 1);
            }

            if (inputField.value === '') {
                inputField.value = '0';
            }
        }

        function clearDisplay() {
            inputField.value = '0';
            prevField.innerText = '';
            isResultState = false;
            focusInput();
        }

        /* =========================================
           COMPUTATIONAL PARSING ENGINE
           ========================================= */
        function evaluateMath() {
            focusInput();
            let expression = inputField.value;
            if (expression === '0' || expression === '') return;

            try {
                // String sanitization to conform with standard mathematical evaluation 
                let parseExpr = expression.replace(/×/g, '*').replace(/−/g, '-');
                
                // Constructing an isolated function execution block bypassing direct eval() usage
                let result = new Function('return ' + parseExpr)();

                if (!isFinite(result) || isNaN(result)) throw new Error("Invalid Execution");

                // Precision scaling mitigation: Resolves standard IEEE-754 64-bit float anomalies
                result = Math.round(result * 1e12) / 1e12;

                prevField.innerText = expression + ' =';
                inputField.value = result;
                
                saveHistory(expression, result);
                isResultState = true;
                
            } catch (error) {
                prevField.innerText = expression + ' =';
                inputField.value = "Error";
                isResultState = true;
            }
        }

        /* =========================================
           LOCAL STORAGE SYNCHRONIZATION API
           ========================================= */
        function saveHistory(expr, result) {
            let history = JSON.parse(localStorage.getItem('calc_history')) || [];
            history.unshift({ expr: expr, res: result });
            
            // Garbage collection: strict 20-index array limitation to prevent storage bloat
            if (history.length > 20) history.pop(); 
            localStorage.setItem('calc_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            historyList.innerHTML = '';
            let history = JSON.parse(localStorage.getItem('calc_history')) || [];
            
            if(history.length === 0) {
                historyList.innerHTML = '<div style="text-align:center; color:#8a8a8a; margin-top:20px;">No History Found</div>';
                return;
            }

            // Dynamically constructs historical UI nodes from the serialized JSON array
            history.forEach(item => {
                let div = document.createElement('div');
                div.className = 'history-entry';
                div.innerHTML = `<div style="font-size:0.85rem; color:#8a8a8a">${item.expr} =</div>
                                 <div style="font-size:1.2rem; color:#00d2d3">${item.res}</div>`;
                div.onclick = () => {
                    inputField.value = item.res;
                    toggleHistory();
                    focusInput();
                };
                historyList.appendChild(div);
            });
        }

        function toggleHistory() {
            dropdownMenu.classList.remove('active');
            historyModal.classList.toggle('active');
            loadHistory();
        }

        function clearHistory() {
            localStorage.removeItem('calc_history');
            loadHistory();
        }

        /* =========================================
           ALGEBRAIC CONVERSION MATRIX
           ========================================= */
        function convertUnit(type) {
            dropdownMenu.classList.remove('active');
            let currentVal = parseFloat(inputField.value);
            if (isNaN(currentVal)) return;

            let result, title;
            switch(type) {
                case 'kg_to_g':
                    result = currentVal * 1000;
                    title = `${currentVal} Kg =`;
                    break;
                case 'g_to_kg':
                    result = currentVal / 1000;
                    title = `${currentVal} g =`;
                    break;
                case 'c_to_f':
                    result = (currentVal * 9/5) + 32;
                    title = `${currentVal} °C =`;
                    break;
                case 'f_to_c':
                    result = (currentVal - 32) * 5/9;
                    title = `${currentVal} °F =`;
                    break;
            }

            // Mitigates fractional anomalies natively introduced during specific thermal conversions
            result = Math.round(result * 1e8) / 1e8;

            prevField.innerText = title;
            inputField.value = result;
            saveHistory(title.replace('=', '').trim(), result);
            isResultState = true;
        }

        // Initialize Web Storage API polling upon DOM load completion
        loadHistory();

    </script>
</body>
</html>
